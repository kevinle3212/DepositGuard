steps:
    # ── Install & lint ─────────────────────────────────────────────────────────

    - id: install
      name: node:20
      entrypoint: yarn
      args: [install, --frozen-lockfile]

    - id: lint
      name: node:20
      entrypoint: yarn
      args: [lint]
      waitFor: [install]

    - id: typecheck
      name: node:20
      entrypoint: yarn
      args: [typecheck]
      waitFor: [install]

    # ── Anchor build ──────────────────────────────────────────────────────────

    - id: anchor-build
      name: backpackapp/build:latest
      entrypoint: anchor
      args: [build]
      waitFor: [-]

    # ── Docker builds (parallel per service) ──────────────────────────────────

    - id: build-verify-wallet
      name: gcr.io/cloud-builders/docker
      args:
          - build
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/verify-wallet:$COMMIT_SHA
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/verify-wallet:latest
          - services/verify-wallet
      waitFor: [lint, typecheck]

    - id: build-upload-contract
      name: gcr.io/cloud-builders/docker
      args:
          - build
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/upload-contract:$COMMIT_SHA
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/upload-contract:latest
          - services/upload-contract
      waitFor: [lint, typecheck]

    - id: build-send-signing-link
      name: gcr.io/cloud-builders/docker
      args:
          - build
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/send-signing-link:$COMMIT_SHA
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/send-signing-link:latest
          - services/send-signing-link
      waitFor: [lint, typecheck]

    - id: build-assess-damage
      name: gcr.io/cloud-builders/docker
      args:
          - build
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/assess-damage:$COMMIT_SHA
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/assess-damage:latest
          - services/assess-damage
      waitFor: [lint, typecheck]

    - id: build-tts
      name: gcr.io/cloud-builders/docker
      args:
          - build
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/tts:$COMMIT_SHA
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/tts:latest
          - services/tts
      waitFor: [lint, typecheck]

    - id: build-notify
      name: gcr.io/cloud-builders/docker
      args:
          - build
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/notify:$COMMIT_SHA
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/notify:latest
          - services/notify
      waitFor: [lint, typecheck]

    - id: build-webhook-deadline
      name: gcr.io/cloud-builders/docker
      args:
          - build
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/webhook-deadline:$COMMIT_SHA
          - -t
          - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/webhook-deadline:latest
          - services/webhook-deadline
      waitFor: [lint, typecheck]

    # ── Push images ───────────────────────────────────────────────────────────

    - id: push-images
      name: gcr.io/cloud-builders/docker
      entrypoint: bash
      args:
          - -c
          - |
              for svc in verify-wallet upload-contract send-signing-link assess-damage tts notify webhook-deadline; do
                docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/$svc:$COMMIT_SHA
                docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/$svc:latest
              done
      waitFor:
          - build-verify-wallet
          - build-upload-contract
          - build-send-signing-link
          - build-assess-damage
          - build-tts
          - build-notify
          - build-webhook-deadline

    # ── Deploy to Cloud Run ───────────────────────────────────────────────────

    - id: deploy
      name: gcr.io/google.com/cloudsdktool/cloud-sdk
      entrypoint: bash
      args:
          - -c
          - |
              for svc in verify-wallet upload-contract send-signing-link assess-damage tts notify webhook-deadline; do
                gcloud run deploy nestcrow-$svc \
                  --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/$svc:$COMMIT_SHA \
                  --region ${_REGION} \
                  --platform managed \
                  --quiet
              done
      waitFor: [push-images]

images:
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/verify-wallet:$COMMIT_SHA
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/upload-contract:$COMMIT_SHA
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/send-signing-link:$COMMIT_SHA
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/assess-damage:$COMMIT_SHA
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/tts:$COMMIT_SHA
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/notify:$COMMIT_SHA
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nestcrow/webhook-deadline:$COMMIT_SHA

substitutions:
    _REGION: us-central1

options:
    logging: CLOUD_LOGGING_ONLY
    machineType: E2_HIGHCPU_8
